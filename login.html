<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Login | PVT&T FACTORY</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/Logo_Icons3.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/Logo_Icons3.png" />
    <link rel="apple-touch-icon" href="/icons/Logo_Icons3.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#13265C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PVT&amp;T Factory" />

    <!-- CSS -->
    <link rel="stylesheet" href="/css/loadingService.css" />
    <link rel="stylesheet" href="/css/login.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <link rel="stylesheet" href="/css/splash.css" />
    <link rel="stylesheet" href="/css/offline-queue.css" />
    <link rel="stylesheet" href="/css/app-shell.css" />
    <link rel="stylesheet" href="/css/login-app.css" />
    <script src="/core/appShell.js"></script>
  </head>

  <body>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/core/supabaseClient.js"></script>
    <script src="/core/activityLogger.js"></script>
    <!-- Splash Screen -->
    <div id="splash-screen" class="pvt-splash" role="status" aria-label="กำลังเปิดแอป">
      <div class="pvt-splash-mark" aria-hidden="true">
        <span class="pvt-splash-glow"></span>
        <svg class="pvt-splash-ring" viewBox="0 0 120 120">
          <defs>
            <linearGradient id="pvtSplashRing" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ff8a3d" />
              <stop offset="0.55" stop-color="#f26a1b" />
              <stop offset="1" stop-color="#1e3a8a" />
            </linearGradient>
          </defs>
          <circle class="track" cx="60" cy="60" r="54" />
          <circle class="arc" cx="60" cy="60" r="54" />
        </svg>
        <img class="pvt-splash-logo" src="/icons/Logo_Apps3.png?v=3" alt="" />
      </div>
      <div class="pvt-splash-title">PVT&amp;T Factory</div>
      <div class="pvt-splash-sub">ระบบบันทึกข้อมูลของเสียจากการผลิต</div>
    </div>

    <!-- Login Overlay -->
    <div id="login-overlay" class="pvt-loader hidden" role="status" aria-live="polite">
      <div class="pvt-loader-card">
        <div class="pvt-loader-mark" aria-hidden="true">
          <svg class="pvt-loader-ring" viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <linearGradient id="pvtLoaderRing" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ff8a3d" />
              <stop offset="0.55" stop-color="#f26a1b" />
              <stop offset="1" stop-color="#1e3a8a" />
            </linearGradient>
          </defs>
          <circle class="track" cx="60" cy="60" r="54" />
          <circle class="arc" cx="60" cy="60" r="54" />
        </svg>
          <img class="pvt-loader-logo" src="/icons/Logo_Apps3.png?v=3" alt="" />
        </div>
        <h3 class="pvt-loader-title">กำลังเข้าสู่ระบบ...</h3>
        <p class="pvt-loader-text">กรุณารอสักครู่</p>
      </div>
    </div>

    <div class="pvt-top-header">
      <div class="logo">
        <img
          src="/icons/Logo_Apps3.png?v=3"
          alt="PVT&T FACTORY Logo"
          width="100"
          height="100"
          style="width: 100px; height: 100px; max-width: 100px; max-height: 100px; object-fit: contain;"
        />
        <div>
          <!-- <h2>PVT&T FACTORY</h2> -->
          <!-- <p>ศูนย์รวมข้อมูลและระบบงาน</p> -->
        </div>
      </div>

      <h1>ระบบบันทึกข้อมูลของเสียจากการผลิต</h1>
      <p>บริษัท พี.วี.ที.แอนด์ ที.พลาส จำกัด</p>

    </div>
    <!-- Main Login -->
    <main class="login-page">
      <section class="login-card">
        <form id="loginForm" onsubmit="handlePasswordLogin(event)">
          <h2>🔐 เข้าสู่ระบบ</h2>
          <!-- <p class="subtitle">สำหรับ Notebook / PC</p> -->

          <div class="form-group">
            <label for="username">Username</label>
            <input
              id="username"
              class="form-control"
              type="text"
              placeholder="เช่น PVT001"
              autocomplete="username"
              required
            />
          </div>

          <div class="form-group">
            <label for="pvtPassword">Password</label>
            <div class="password-row">
              <input
                id="pvtPassword"
                class="form-control"
                type="password"
                placeholder="กรอกรหัสผ่าน"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="btn-eye"
                onclick="togglePasswordVisibility()"
              >
                <span class="material-symbols-outlined" id="eyeIcon">
                  visibility
                </span>
              </button>
            </div>
          </div>

          <label class="remember-row">
            <input type="checkbox" id="rememberMe" />
            จำ Username ไว้ในเครื่องนี้
          </label>

          <button type="submit" class="btn-login">เข้าสู่ระบบ</button>

          <button type="button" class="btn-scan-qr" onclick="showQrScanner()">
            <span class="material-symbols-outlined"> qr_code_scanner </span>
            สแกน QR Code
          </button>
        </form>
      </section>
      <div id="qrScannerModal" class="qr-modal hidden">
        <div class="qr-modal-box">
          <div class="qr-modal-header">
            <h3>สแกน QR Code</h3>

            <button
              type="button"
              class="qr-close"
              onclick="window.location.href = 'login.html'"
            >
              ✕
            </button>
          </div>

          <div id="qr-reader"></div>

          <p class="qr-hint">นำกล้องไปส่อง QR Code ประจำแผนก</p>
        </div>
      </div>

      <!-- QR Login Box -->
      <section class="qr-login-box hidden" id="qrLoginBox">
        <h2>📱 เข้าระบบผ่าน QR Code</h2>
        <p class="subtitle">แผนก: <strong id="qrDeptName">-</strong></p>

        <div class="form-group">
          <label for="qrStaffSelect">เลือกชื่อผู้บันทึก</label>
          <select id="qrStaffSelect" class="form-control">
            <option value="">-- เลือกผู้บันทึก --</option>
          </select>
        </div>

        <button type="button" class="btn-qr" onclick="handleQrLogin()">
          เข้าสู่หน้าบันทึกข้อมูล
        </button>
      </section>
    </main>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- JS -->

    <script src="/core/roleConfig.js"></script>
    <script src="/auth/authGuard.js"></script>
    <script src="/services/loadingService.js"></script>
    <script src="/auth/login.js"></script>
    <script src="/js/department/offlineQueue.js"></script>
      <script src="/core/responsiveTables.js"></script>
  </body>
</html>
