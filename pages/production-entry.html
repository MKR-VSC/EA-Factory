<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>กรอกยอดผลิตทั้งใบ - PVT&amp;T FACTORY</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="icon" type="image/png" href="/icons/logo-header.png" />
    <link rel="apple-touch-icon" href="/icons/Logo_Apps3.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />

    <link rel="stylesheet" href="/css/form-mobile.css" />
    <link rel="stylesheet" href="/css/review-simple.css" />
    <link rel="stylesheet" href="/css/accounting-simple.css" />
    <link rel="stylesheet" href="/css/production-entry.css" />
    <script src="/js/department/formSettings.js"></script>
  </head>

  <body class="rv acc pe">
    <header class="fm-top rv-top acc-top">
      <img class="fm-logo" src="/icons/logo-header.png" width="42" height="37" alt="PVT&amp;T FACTORY" />
      <div class="fm-top-title">
        <h1>กรอกยอดผลิตทั้งใบ</h1>
        <p><span id="lbl-user">-</span> · จากใบรายงานการผลิตประจำวัน</p>
      </div>
      <button type="button" id="btn-refresh" class="fm-icon-btn" aria-label="โหลดข้อมูลล่าสุด" title="โหลดข้อมูลล่าสุด">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" /></svg>
      </button>
      <button type="button" class="fm-icon-btn" onclick="FORM_SETTINGS.open()" aria-label="ตั้งค่าตัวอักษร" title="ตั้งค่าตัวอักษร">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19l5-14h2l5 14M6.5 13h7" /><path d="M17 11h4M19 9v4" /></svg>
      </button>
    </header>

    <div id="toast-container" class="pe-toasts" aria-live="polite"></div>

    <div class="acc-layout">
      <nav class="acc-side" aria-label="เมนู"><!-- เมนูสร้างจาก js/accounting/accountingSimpleNav.js (ชุดเดียวทุกหน้า) --></nav>

      <main class="acc-main">
        <section class="rv-card pe-controls">
          <label class="pe-field">
            <span>วันที่ในใบรายงาน</span>
            <input type="date" id="in-day" />
          </label>
          <label class="pe-field">
            <span>แผนก</span>
            <select id="in-dept"><option value="all">ทุกแผนก</option></select>
          </label>
          <div class="pe-ctl-actions">
            <button type="button" class="btn light" id="btn-prev" aria-label="วันก่อนหน้า">‹</button>
            <button type="button" class="btn light" id="btn-next" aria-label="วันถัดไป">›</button>
            <button type="button" class="btn light" id="btn-copy" title="ใส่สินค้า/กะ/หน่วย ของวันก่อนหน้าให้เครื่องที่ยังว่าง (ไม่ใส่น้ำหนัก)">ดึงสินค้าจากวันก่อน</button>
          </div>
          <p class="pe-hint">กรอกตามใบกระดาษ · Enter = ช่องถัดไป · Shift+Enter = ย้อนกลับ · บรรทัดที่ไม่มีน้ำหนักจะไม่บันทึก</p>
        </section>

        <div id="pe-alert" class="pe-alert" hidden></div>

        <div id="pe-list" class="pe-list" aria-live="polite">
          <p class="pe-empty">กำลังโหลด...</p>
        </div>

        <div class="pe-savebar" id="pe-savebar" hidden>
          <div>
            <strong id="pe-dirty-count">0 เครื่อง</strong> ยังไม่บันทึก
            <small id="pe-dirty-total"></small>
          </div>
          <button type="button" class="btn light" id="btn-discard">คืนค่าเดิม</button>
          <button type="button" class="btn primary" id="btn-save">บันทึกทั้งใบ</button>
        </div>
      </main>
    </div>

    <nav class="fm-tabbar acc-tabbar no-print" aria-label="เมนู"></nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/core/supabaseClient.js"></script>
    <script src="/core/supabaseFetch.js"></script>
    <script src="/auth/authGuard.js"></script>
    <script src="/core/roleConfig.js"></script>
    <script src="/core/wasteFormula.js"></script>
    <script src="/js/accounting/production-entry.js"></script>
    <script src="/js/accounting/accountingSimpleNav.js"></script>
  </body>
</html>
