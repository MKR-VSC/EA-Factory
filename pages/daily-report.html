<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>รายงานการผลิตและของเสีย - PVT&amp;T FACTORY</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="icon" type="image/png" href="/icons/logo-header.png" />
    <link rel="apple-touch-icon" href="/icons/Logo_Apps3.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />

    <link rel="stylesheet" href="/css/form-mobile.css" />
    <link rel="stylesheet" href="/css/review-simple.css" />
    <link rel="stylesheet" href="/css/accounting-simple.css" />
    <link rel="stylesheet" href="/css/daily-report.css" />
    <script src="/js/department/formSettings.js"></script>
  </head>

  <body class="rv acc dr">
    <header class="fm-top rv-top acc-top">
      <img class="fm-logo" src="/icons/logo-header.png" width="42" height="37" alt="PVT&amp;T FACTORY" />
      <div class="fm-top-title">
        <h1>รายงานการผลิตและของเสีย</h1>
        <p><span id="lbl-user">-</span> · แบบใบรายงานประจำวัน</p>
      </div>
      <button type="button" id="btn-refresh" class="fm-icon-btn" aria-label="โหลดข้อมูลล่าสุด" title="โหลดข้อมูลล่าสุด">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" /></svg>
      </button>
      <button type="button" class="fm-icon-btn" onclick="FORM_SETTINGS.open()" aria-label="ตั้งค่าตัวอักษร" title="ตั้งค่าตัวอักษร">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19l5-14h2l5 14M6.5 13h7" /><path d="M17 11h4M19 9v4" /></svg>
      </button>
    </header>

    <div class="acc-layout">
      <nav class="acc-side" aria-label="เมนู"><!-- เมนูสร้างจาก js/accounting/accountingSimpleNav.js (ชุดเดียวทุกหน้า) --></nav>

      <main class="acc-main">
        <section class="rv-card dr-controls no-print">
          <div class="dr-mode" role="group" aria-label="ช่วงรายงาน">
            <button type="button" class="dr-mode-btn is-active" data-mode="day">รายวัน</button>
            <button type="button" class="dr-mode-btn" data-mode="month">รายเดือน</button>
          </div>
          <label class="dr-field" id="wrap-day">
            <span>วันที่</span>
            <input type="date" id="in-day" />
          </label>
          <label class="dr-field" id="wrap-month" hidden>
            <span>เดือน</span>
            <input type="month" id="in-month" />
          </label>
          <label class="dr-field">
            <span>แผนก</span>
            <select id="in-dept"><option value="all">ทุกแผนก</option></select>
          </label>
          <div class="dr-actions">
            <button type="button" class="btn light" id="btn-prev" aria-label="ก่อนหน้า">‹</button>
            <button type="button" class="btn light" id="btn-next" aria-label="ถัดไป">›</button>
            <button type="button" class="btn primary" id="btn-print">พิมพ์ / PDF</button>
          </div>
        </section>

        <div id="dr-alert" class="dr-alert no-print" hidden></div>

        <article class="dr-sheet" id="dr-sheet" aria-live="polite">
          <p class="dr-empty">กำลังโหลด...</p>
        </article>
      </main>
    </div>

    <nav class="fm-tabbar acc-tabbar no-print" aria-label="เมนู"></nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/core/supabaseClient.js"></script>
    <script src="/core/supabaseFetch.js"></script>
    <script src="/auth/authGuard.js"></script>
    <script src="/core/roleConfig.js"></script>
    <script src="/core/wasteFormula.js"></script>
    <script src="/js/accounting/daily-report.js"></script>
    <script src="/js/accounting/accountingSimpleNav.js"></script>
  </body>
</html>
