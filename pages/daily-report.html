      <div class="fm-top-title">
        <h1>รายงานการผลิตและของเสีย</h1>
        <p><span id="lbl-user">-</span> · แบบใบรายงานประจำวัน</p>

          <a class="acc-side-item" data-role-only="admin accounting management" href="/pages/production-entry.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM4 10h16M9 10v9M15 10v9" /></svg><span>กรอกยอดผลิตทั้งใบ</span></a>

          <a class="acc-side-item is-active" aria-current="page" href="/pages/daily-report.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h7" /></svg><span>รายงานประจำวัน</span></a>

        </div>
        <div class="acc-side-group" id="accSideOther" hidden>
          <span class="acc-side-title">ไปหน้าอื่น</span>

        <button type="button" class="acc-side-item acc-side-logout" id="btn-logout-side"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9" /></svg><span>ออกจากระบบ</span></button>

      <main class="acc-main">
        <section class="rv-card dr-controls no-print">
          <div class="dr-mode" role="group" aria-label="ช่วงรายงาน">
            <button type="button" class="dr-mode-btn is-active" data-mode="day">รายวัน</button>
            <button type="button" class="dr-mode-btn" data-mode="month">รายเดือน</button>
          </div>
          <label class="dr-field" id="wrap-day">
            <span>วันที่</span>
            <input type="date" id="in-day" />
          </label>
          <label class="dr-field" id="wrap-month" hidden>
            <span>เดือน</span>
            <input type="month" id="in-month" />
          </label>
          <label class="dr-field">
            <span>แผนก</span>
            <select id="in-dept"><option value="all">ทุกแผนก</option></select>
          </label>
          <div class="dr-actions">
            <button type="button" class="btn light" id="btn-prev" aria-label="ก่อนหน้า">‹</button>
            <button type="button" class="btn light" id="btn-next" aria-label="ถัดไป">›</button>
            <button type="button" class="btn primary" id="btn-print">พิมพ์ / PDF</button>
          </div>
        </section>

        <div id="dr-alert" class="dr-alert no-print" hidden></div>

        <article class="dr-sheet" id="dr-sheet" aria-live="polite">
          <p class="dr-empty">กำลังโหลด...</p>
        </article>
      </main>

      <a class="fm-tab is-active" aria-current="page" href="/pages/daily-report.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h7" /></svg><span class="fm-tab-label">รายงาน</span></a>
      <a class="fm-tab" data-role-only="supervisor" href="/pages/supervisor-daily-review.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3 8-8M20 12v8H4V4h11" /></svg><span class="fm-tab-label">ตรวจสอบ</span></a>
