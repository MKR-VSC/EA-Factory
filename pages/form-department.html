<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>บันทึกของเสีย - PVT&amp;T FACTORY</title>

    <!-- โหลดเร็ว: ไม่ใช้ Google Fonts / ไอคอนฟอนต์ ใช้ฟอนต์ไทยที่มีในเครื่องอยู่แล้ว -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="icon" type="image/png" href="/icons/logo-header.png" />
    <link rel="apple-touch-icon" href="/icons/Logo_Apps3.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PVT&amp;T Factory" />

    <link rel="stylesheet" href="/css/form-mobile.css" />
    <!-- ใช้ฟอนต์/ขนาดที่ตั้งไว้ตั้งแต่ก่อนหน้าแสดง -->
    <script src="/js/department/formSettings.js"></script>
  </head>

  <body>
    <!-- แถบหัว -->
    <header class="fm-top">
      <button type="button" class="fm-icon-btn" id="btn-back" aria-label="ย้อนกลับ">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <img class="fm-logo" src="/icons/logo-header.png" width="42" height="37" alt="PVT&amp;T FACTORY" />
      <div class="fm-top-title">
        <h1>บันทึกของเสีย</h1>
        <p><span id="current-dept-label">-</span></p>
      </div>
      <span class="fm-net" id="network-status-text" aria-live="polite">ออนไลน์</span>
      <button type="button" class="fm-icon-btn" id="btn-settings" aria-label="ตั้งค่าตัวอักษร" title="ตั้งค่าตัวอักษร">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19l5-14h2l5 14M6.5 13h7" /><path d="M17 11h4M19 9v4" /></svg>
      </button>
    </header>

    <main class="fm-main" id="dept-body">
      <!-- ผู้บันทึก -->
      <button type="button" class="fm-user" onclick="openStaffNameModal(true)">
        <span class="fm-user-label">ผู้บันทึก</span>
        <strong id="display-username">ยังไม่ได้ระบุชื่อ</strong>
        <span class="fm-link">เปลี่ยน</span>
      </button>

      <!-- แสดงเฉพาะตอนเปิดจาก QR -->
      <div id="qr-context-card" class="fm-qr" style="display: none">
        <div><span>แผนก</span><strong id="qr-dept-label">-</strong></div>
        <div><span>เครื่องจักร</span><strong id="qr-machine-label">-</strong></div>
      </div>

      <form id="department-waste-form" novalidate>
        <div class="fm-card">
          <div class="fm-field">
            <label for="incident-datetime">วัน-เวลาที่พบปัญหา <b>*</b></label>
            <input type="datetime-local" id="incident-datetime" required />
          </div>

          <div class="fm-field">
            <label for="work-shift">กะ <b>*</b></label>
            <select id="work-shift" required>
              <option value="">เลือกกะ</option>
            </select>
          </div>

          <div class="fm-field">
            <label for="machine-no">เครื่องจักร <b>*</b></label>
            <select id="machine-no" required>
              <option value="">กำลังโหลด...</option>
            </select>
          </div>
        </div>

        <h2 class="fm-section">รายการปัญหา</h2>
        <div id="problem-items" class="fm-problems"></div>

        <button type="button" id="btn-add-problem" class="fm-btn fm-btn-outline">+ เพิ่มปัญหา</button>

        <div class="fm-total">
          <span>น้ำหนักของเสียรวม</span>
          <strong><span id="total-waste-kg">0.00</span> kg</strong>
        </div>
      </form>
    </main>

    <!-- แถบไอคอนด้านล่าง -->
    <nav class="fm-tabbar" aria-label="เมนูหลัก">
      <button type="button" class="fm-tab btn-clear" onclick="resetFormWithConfirm()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" /></svg>
        <span class="fm-tab-label">ล้างข้อมูล</span>
      </button>
      <a class="fm-tab" href="/login.html#scan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M4 12h16" /></svg>
        <span class="fm-tab-label">สแกน QR</span>
      </a>
      <button type="submit" form="department-waste-form" class="fm-tab fm-tab-save btn-submit">
        <span class="fm-tab-save-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6" /></svg>
        </span>
        <span class="fm-tab-label">บันทึก</span>
      </button>
      <button type="button" class="fm-tab" onclick="openStaffNameModal(true)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21c1-4 4-6 8-6s7 2 8 6" /></svg>
        <span class="fm-tab-label">ผู้บันทึก</span>
      </button>
      <button type="button" class="fm-tab" onclick="handleLogout()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9" /></svg>
        <span class="fm-tab-label">ออก</span>
      </button>
    </nav>

    <!-- ระบุชื่อผู้บันทึก -->
    <div id="staff-name-modal" class="fm-modal hidden">
      <div class="fm-modal-box">
        <h3>ชื่อผู้บันทึก</h3>
        <p>ใช้ตรวจสอบย้อนหลังว่าใครเป็นผู้บันทึก</p>
        <input id="staff-name-input" type="text" placeholder="เช่น สมชาย" autocomplete="name" enterkeyhint="done" />
        <button type="button" class="fm-btn fm-btn-primary" onclick="confirmStaffName()">เริ่มกรอกข้อมูล</button>
      </div>
    </div>

    <!-- กำลังบันทึก -->
    <div id="login-overlay" class="fm-loading hidden" role="status" aria-live="polite">
      <div class="fm-loading-box">
        <span class="fm-spinner" aria-hidden="true"></span>
        <h3>กำลังบันทึกข้อมูล...</h3>
        <p>กรุณารอสักครู่</p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/core/supabaseClient.js"></script>
    <script src="/core/activityLogger.js"></script>
    <script src="/core/ea-common.js"></script>
    <script src="/js/department/form-department.js"></script>
    <script src="/js/department/offlineQueue.js"></script>
  </body>
</html>
